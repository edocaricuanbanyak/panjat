name: Cron

# All scheduled crons now run on cron-job.org (always-on, no GitHub limits;
# GitHub Actions halts when account billing fails, which silently killed every
# job here). This workflow is kept ONLY for manual fallback triggers via
# workflow_dispatch. It hits /api/cron/* on the production site with CRON_SECRET.
#
# Schedule reference (all now on cron-job.org, times in WIB / UTC+7):
#   rosot          hourly :00        moderasi       hourly :30
#   jaga-posisi    hourly :05        tebak          daily 00:00 WIB
#   screenshot     hourly :15        lencana        daily 01:00 WIB
#   reconcile      daily 02:00 WIB   juara-mingguan  Fri 00:05 WIB

on:
  workflow_dispatch:
    inputs:
      path:
        description: "cron path to trigger manually (e.g. rosot, reconcile, tebak)"
        required: true
        default: reconcile

jobs:
  hit:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cron endpoint
        env:
          BASE: https://www.panjat.id # the direct-serving domain (apex 308→www strips auth on redirect)
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          P="${{ github.event.inputs.path }}"
          echo "→ GET $BASE/api/cron/$P"
          curl -fsS --max-time 300 -H "Authorization: Bearer $SECRET" "$BASE/api/cron/$P"
