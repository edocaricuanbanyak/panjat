name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: typecheck · test · lint
    runs-on: ubuntu-latest
    env:
      # Dummy so the import-time guard in src/db/index.ts doesn't throw. The unit
      # tests are pure (they never open a DB connection), so it's never dialed.
      # REDIS_URL is intentionally unset — redis() degrades to null.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      # Non-blocking: the repo has an accepted lint baseline (satori/remote <img>,
      # internal <a> links). Surface it, but don't fail the build on it.
      - name: Lint (informational)
        run: pnpm lint
        continue-on-error: true
